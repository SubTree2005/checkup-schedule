[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkup-scheduler"
version = "10.0.0"
description = "Wait-oriented rolling-horizon scheduling for medical checkups"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
optimization = ["ortools>=9.10"]

[tool.setuptools.packages.find]
where = ["packages/scheduler"]
include = ["checkup_scheduler*"]
