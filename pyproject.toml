[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkup-scheduler"
version = "0.2.0"
description = "Wait-oriented rolling-horizon scheduling for medical checkups"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
optimization = ["ortools>=9.10"]
backend = [
  "fastapi>=0.115,<1",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["packages/scheduler"]
include = ["checkup_scheduler*"]
